# Optional infrastructure for the "production-style" setup (Postgres + pgvector, Redis).
# The API, Celery worker and frontend run on your machine (the API needs access to Docker for the test sandbox).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lci
      POSTGRES_PASSWORD: lci
      POSTGRES_DB: lci
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
